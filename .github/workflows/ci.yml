name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: native, wasm, page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: alire-project/setup-alire@v5
        with:
          version: "2.1.1"
          toolchain: gnat_native=16.1.0 gprbuild=26.0.1

      - name: Guide quotes
        run: python3 tools/check-howto-quote.py

      - name: Locked statements
        env:
          CHECK_LOCKED_EVENT: ${{ github.event_name }}
          CHECK_LOCKED_BASE: ${{ github.event.pull_request.base.sha }}
          CHECK_LOCKED_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 tools/check-locked.py
          ./tools/check-locked-selftest.sh
          ./tools/check-recheck-selftest.sh

      - name: Native hello
        run: |
          alr -n build
          ./tools/check-version.sh
          ./bin/tensors_test
          ./bin/mlp_test
          ./bin/attention_test
          ./bin/recurse_test
          ./bin/traces_test
          ./bin/audit_test
          ./bin/audit_cli
          ./bin/reward_test
          ./bin/reward_cli
          ./bin/harness_test
          ./bin/harness_cli
          ./bin/steps_test
          ./bin/steps_cli
          ./bin/recheck_test
          ./tools/run-specs.sh

      # Level 2, on the SPARK units only. prove.sh installs FSF
      # gnatprove 16.1.0 if the runner does not already have it.
      # --checks-as-errors=on is in the project file, so an unproved
      # check fails this step. Units with SPARK_Mode => Off are skipped.
      - name: GNATprove
        run: ./prove.sh

      - name: Chrome
        run: |
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y /tmp/chrome.deb

      - name: WebAssembly and page
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            rpm2cpio cpio lld libedit2
          ./tools/get-toolchain.sh
          npm ci
          ./build.sh
          node tools/page-smoke.mjs

  # The commands are tools/howto-packages.sh and tools/howto-steps.sh.
  # docs/HOWTO.md quotes both files. This job is a clean runner so the
  # guide stays something a newcomer can follow.
  howto:
    name: how-to steps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: alire-project/setup-alire@v5
        with:
          version: "2.1.1"
          toolchain: gnat_native=16.1.0 gprbuild=26.0.1

      - name: Guide quotes
        run: python3 tools/check-howto-quote.py

      - name: Packages from the guide
        run: ./tools/howto-packages.sh

      - name: Steps from the guide
        run: ./tools/howto-steps.sh
